# This config file is optional!!! If this file exists next to the .sh file, it's loaded by the script.
# You can delete this file to use the built-in defaults.





# RiftLift's game slug to launch. To get your game's slug, run `riftlift list`.
SLUG="echo-vr"

# How many launch-patch-relaunch rounds to attempt before giving up.
MAX_LAUNCHES="25"

# Where RiftLift's Proton log lives. Leave blank to use the default:
#   ~/.local/share/riftlift/diagnostics/proton/steam-0.log
# Override this if your RiftLift install keeps diagnostics somewhere else.
RIFTLIFT_LOG=""

# Where to store dumped/patched shaders. Leave blank to let the script pick
# the first writable location from:
#   ~/.local/state/echo-vr/shaders
#   ~/.local/share/echo-vr/shaders
#   ~/Documents/echo-vr/shaders
# Set this to force a specific location instead.
SHADER_ROOT_OVERRIDE=""
